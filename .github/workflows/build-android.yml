name: Build Android AAB

# Click "Run workflow" in the Actions tab to build a signed .aab for Play.
# Uses `eas build --local`, which runs on GitHub's free runners and does NOT
# consume your EAS cloud build quota. Signing keys are pulled from your Expo
# account automatically via the EXPO_TOKEN secret, so the .aab is signed with
# the same upload key as your previous Play releases.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Build signed AAB (local — no cloud quota used)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile production --local --non-interactive --output "${{ github.workspace }}/app-release.aab"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app-release.aab
          if-no-files-found: error
          retention-days: 14
